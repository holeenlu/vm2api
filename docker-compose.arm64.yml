# Experimental native ARM64 control plane; Docker slot guests remain amd64.
# docker compose -f docker-compose.yml -f docker-compose.arm64.yml up -d --build
services:
  tapmodels:
    image: ${TAPMODELS_ARM64_IMAGE:-tapmodels-arm64-control:local}
    platform: linux/arm64
    build:
      context: .
      dockerfile: deploy/Dockerfile.arm64-control
    environment:
      HOST: ${TAPMODELS_BIND_HOST:-127.0.0.1}
      DOCKER_DEFAULT_PLATFORM: linux/amd64
      KIN_CLUSTER_WORKER_BIN: /opt/tapmodels/cluster-bin-amd64/kin-worker
      KIN_CLUSTER_EGRESS_BIN: /opt/tapmodels/cluster-bin-amd64/kin-egress
      KIN_CLUSTER_GATE_BIN: /opt/tapmodels/cluster-bin-amd64/kin-slot-gate
    volumes:
      # Keep native runtime helpers out of the repository's amd64 bin/ assets.
      - ./.local/arm64/vms:/opt/tapmodels/vms
      - ./.local/arm64/data:/opt/tapmodels/data
      - ./.local/arm64/bin:/opt/tapmodels/bin
      - ./.local/arm64/share:/opt/tapmodels/share
      - ./.local/arm64/config:/opt/tapmodels/src/config
