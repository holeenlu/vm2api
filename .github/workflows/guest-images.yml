# Guest and KVM images are part of every upstream system release.
name: guest-images

on:
  workflow_call:
    inputs:
      source_commit:
        description: 'Frozen source selected by the system release workflow'
        required: true
        type: string
  workflow_dispatch:

concurrency:
  group: guest-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guest:
    if: github.repository == 'holeenlu/vm2api' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: ubuntu-24.04
            image: ubuntu:24.04
          - directory: debian-12
            image: debian:12
          - directory: archlinux
            image: arch:latest
          - directory: fedora-41
            image: fedora:41
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve image tag
        id: meta
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: echo "tag=ghcr.io/${REPOSITORY_OWNER,,}/kin-os-${IMAGE}" >> "$GITHUB_OUTPUT"
      - name: build and push guest image
        uses: docker/build-push-action@v7
        with:
          context: docker/kin-os/${{ matrix.directory }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=kin-os-${{ matrix.directory }}
          cache-to: type=gha,scope=kin-os-${{ matrix.directory }},mode=max

  # URLs must match src/lib/vm/os-catalog.mjs kvm.cloud_image.
  kvm:
    if: github.repository == 'holeenlu/vm2api' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: ubuntu
            tag: '24.04'
            cloud_image: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
          - family: debian
            tag: '12'
            cloud_image: https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-generic-amd64.qcow2
          - family: arch
            tag: latest
            cloud_image: https://geo.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2
          - family: fedora
            tag: '41'
            cloud_image: https://download.fedoraproject.org/pub/archive/fedora/linux/releases/41/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-41-1.4.x86_64.qcow2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve image tag
        id: meta
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          FAMILY: ${{ matrix.family }}
          TAG: ${{ matrix.tag }}
        run: echo "tag=ghcr.io/${REPOSITORY_OWNER,,}/kin-kvm-${FAMILY}:${TAG}" >> "$GITHUB_OUTPUT"
      - name: build and push kvm runner
        uses: docker/build-push-action@v7
        with:
          context: docker/kin-kvm
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          build-args: |
            CLOUD_IMAGE_URL=${{ matrix.cloud_image }}
          cache-from: type=gha,scope=kin-kvm-${{ matrix.family }}
          cache-to: type=gha,scope=kin-kvm-${{ matrix.family }},mode=max
