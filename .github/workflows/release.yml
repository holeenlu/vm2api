name: Versioned system release
run-name: tapmodels · ${{ github.event_name == 'push' && 'upstream system release' || (inputs.publish && 'release' || 'build verification') }}
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: '发布当前定制提交（不勾选仅构建验证）；沿用已集成上游版本 X.Y.Z，修订号从 .1 开始递增，无需同步最新上游'
        type: boolean
        default: true
      upstream_version:
        description: '补发当前上游原版号 X.Y.Z（不增加 .N）；已发布版本会跳过'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: tapmodels-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'holeenlu/vm2api' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
      image: ${{ steps.plan.outputs.image }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select upstream version releases from actual push trees
        id: guard
        run: python3 scripts/release/upstream_release_guard.py
      - name: Validate release plan tooling
        if: steps.guard.outputs.release == 'true'
        run: python3 -m unittest discover -s test/release -v
      - name: Plan or reserve draft release
        if: steps.guard.outputs.release == 'true'
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          AUTOMATIC_RELEASE: ${{ github.event_name == 'push' || inputs.upstream_version }}
        run: python3 scripts/release/plan.py
      - uses: actions/upload-artifact@v7
        if: steps.plan.outputs.release == 'true'
        with:
          name: release-plan
          path: release-plan.json
          retention-days: 14

  checks:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Apply planned application version
        env:
          FORK_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/release/plan.py --stamp-version "$FORK_VERSION"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - run: npm ci
      - name: Verify identity, authorization and update contracts
        run: node --test test/unit/panel-users.test.mjs test/unit/panel-acl.test.mjs test/unit/panel-profile.test.mjs test/unit/site-branding.test.mjs test/unit/release.test.mjs test/unit/release-kernel.test.mjs test/unit/panel-wrap-sync.test.mjs test/unit/codex-models.test.mjs test/e2e/panel-profile.e2e.test.mjs test/e2e/codex-key-catalog.e2e.test.mjs test/e2e/relay-operations.e2e.test.mjs
      - name: Verify frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: release-web
          path: web/dist
          if-no-files-found: error
          retention-days: 14

  linux-amd64:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Apply planned application version
        env:
          FORK_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/release/plan.py --stamp-version "$FORK_VERSION"
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version-file: worker/go.mod
          cache: false
      - name: Locate Go caches
        id: go-cache
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: release-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('worker/go.sum', 'api-kernel/go.sum') }}
          restore-keys: |
            release-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify Go helpers
        run: |
          (cd worker && go test ./...)
          (cd api-kernel && go test ./...)
      - name: Build native helpers and verify pinned payloads
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p "$RUNNER_TEMP/release-native/helpers/out"
          (cd worker && go build -buildvcs=false -trimpath -o "$RUNNER_TEMP/release-native/helpers/out/kin-worker" ./cmd/kin-worker)
          (cd worker && go build -buildvcs=false -trimpath -o "$RUNNER_TEMP/release-native/helpers/out/kin-egress" ./cmd/kin-egress)
          (cd worker && go build -buildvcs=false -trimpath -o "$RUNNER_TEMP/release-native/helpers/out/kin-slot-gate" ./cmd/kin-slot-gate)
          (cd api-kernel && go build -buildvcs=false -trimpath -o "$RUNNER_TEMP/release-native/helpers/out/kin-api-kernel" ./cmd/kin-api-kernel)
          node scripts/fetch-payload.mjs --dest "$RUNNER_TEMP/release-native/payload/payload"
          node scripts/fetch-payload.mjs --dest "$RUNNER_TEMP/release-native/payload/payload" --check
          tar -C "$RUNNER_TEMP/release-native" -cf "$RUNNER_TEMP/linux-amd64.tar" helpers payload
      - uses: actions/upload-artifact@v7
        with:
          name: linux-amd64
          path: ${{ runner.temp }}/linux-amd64.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  image-amd64:
    needs: [prepare, checks, linux-amd64]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Apply planned application version
        env:
          FORK_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/release/plan.py --stamp-version "$FORK_VERSION"
      - uses: actions/download-artifact@v8
        with:
          name: release-web
          path: ${{ runner.temp }}/release-web/src/web/dist
      - uses: actions/download-artifact@v8
        with:
          name: linux-amd64
          path: ${{ runner.temp }}
      - name: Restore verified native build contexts
        run: |
          mkdir -p "$RUNNER_TEMP/release-native"
          tar -xf "$RUNNER_TEMP/linux-amd64.tar" -C "$RUNNER_TEMP/release-native"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify restored payloads
        run: node scripts/fetch-payload.mjs --dest "$RUNNER_TEMP/release-native/payload/payload" --check
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: needs.prepare.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: |
            web=${{ runner.temp }}/release-web
            helpers=${{ runner.temp }}/release-native/helpers
            payload=${{ runner.temp }}/release-native/payload
          platforms: linux/amd64
          provenance: false
          push: false
          load: true
          tags: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}-amd64
          cache-from: type=gha,scope=tapmodels-amd64
          cache-to: type=gha,scope=tapmodels-amd64,mode=min
      - name: Smoke test the linux/amd64 image
        env:
          RELEASE_IMAGE: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}-amd64
        run: python3 scripts/release/smoke_image.py "$RELEASE_IMAGE"
      - name: Push verified image
        if: needs.prepare.outputs.publish == 'true'
        env:
          RELEASE_IMAGE: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}-amd64
        run: docker push "$RELEASE_IMAGE"

  guest-images:
    needs: [prepare, checks, linux-amd64]
    if: needs.prepare.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/guest-images.yml
    with:
      source_commit: ${{ needs.prepare.outputs.commit }}
    secrets: inherit

  publish:
    needs: [prepare, image-amd64, guest-images]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@v8
        with:
          name: linux-amd64
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8
        with:
          name: release-plan
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Stage verified release assets
        run: |
          mkdir -p "$RUNNER_TEMP/release-native" release-assets
          tar -xf "$RUNNER_TEMP/linux-amd64.tar" -C "$RUNNER_TEMP/release-native"
          node scripts/fetch-payload.mjs --dest "$RUNNER_TEMP/release-native/payload/payload" --stage release-assets
          # Preserve the application asset name when the pinned payload uses a hotfix name.
          cp "$RUNNER_TEMP/release-native/payload/payload/share/wrap-cli/cli-node" release-assets/cli-node
          cp "$RUNNER_TEMP/release-native/helpers/out/kin-worker" "$RUNNER_TEMP/release-native/helpers/out/kin-egress" "$RUNNER_TEMP/release-native/helpers/out/kin-slot-gate" release-assets/
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify complete artifacts, publish release and promote latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/publish.py
