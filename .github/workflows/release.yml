name: Manual versioned release
run-name: tapmodels · ${{ inputs.publish && 'release' || 'build verification' }}
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release after all builds pass (false = build verification only)'
        type: boolean
        default: false
      version:
        description: 'Optional vX.Y.Z.N; empty uses latest upstream X.Y.Z and next fork revision N (starts at 1)'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: tapmodels-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'holeenlu/vm2api' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
      image: ${{ steps.plan.outputs.image }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release plan tooling
        run: python3 -m unittest discover -s test/release -v
      - name: Plan or reserve draft release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/release/plan.py
      - uses: actions/upload-artifact@v7
        with:
          name: release-plan
          path: release-plan.json
          retention-days: 14

  checks:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Apply planned application version
        env:
          FORK_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/release/plan.py --stamp-version "$FORK_VERSION"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-go@v7
        with:
          go-version-file: worker/go.mod
          cache-dependency-path: |
            worker/go.sum
            api-kernel/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - run: npm ci
      - name: Verify identity, authorization and update contracts
        run: node --test test/unit/panel-users.test.mjs test/unit/panel-acl.test.mjs test/unit/panel-profile.test.mjs test/unit/site-branding.test.mjs test/unit/release.test.mjs test/unit/release-kernel.test.mjs test/unit/panel-wrap-sync.test.mjs test/unit/codex-models.test.mjs test/e2e/panel-profile.e2e.test.mjs test/e2e/codex-key-catalog.e2e.test.mjs
      - name: Verify frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: Verify Go helpers
        run: |
          (cd worker && go test ./...)
          (cd api-kernel && go test ./...)

  linux-amd64:
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Apply planned application version
        env:
          FORK_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/release/plan.py --stamp-version "$FORK_VERSION"
      - uses: actions/setup-go@v7
        with:
          go-version-file: worker/go.mod
          cache-dependency-path: worker/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build native helpers and verify pinned payloads
        run: |
          mkdir -p dist
          (cd worker && CGO_ENABLED=0 go build -trimpath -o ../dist/kin-worker ./cmd/kin-worker)
          (cd worker && CGO_ENABLED=0 go build -trimpath -o ../dist/kin-egress ./cmd/kin-egress)
          (cd worker && CGO_ENABLED=0 go build -trimpath -o ../dist/kin-slot-gate ./cmd/kin-slot-gate)
          node scripts/fetch-payload.mjs
          node scripts/fetch-payload.mjs --stage dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux-amd64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  image-amd64:
    needs: [prepare, linux-amd64]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Apply planned application version
        env:
          FORK_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/release/plan.py --stamp-version "$FORK_VERSION"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: needs.prepare.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: false
          load: true
          tags: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}-amd64
          cache-from: type=gha,scope=tapmodels-amd64
          cache-to: type=gha,scope=tapmodels-amd64,mode=max
      - name: Smoke test the linux/amd64 image
        env:
          RELEASE_IMAGE: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}-amd64
        run: python3 scripts/release/smoke_image.py "$RELEASE_IMAGE"
      - name: Push verified image
        if: needs.prepare.outputs.publish == 'true'
        env:
          RELEASE_IMAGE: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}-amd64
        run: docker push "$RELEASE_IMAGE"

  publish:
    needs: [prepare, image-amd64]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@v8
        with:
          name: linux-amd64
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: release-plan
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify complete artifacts, publish release and promote latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/publish.py
