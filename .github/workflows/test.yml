# PR/main gate: Node + Go + linux/amd64 payloads + web. No ARM64 builds.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      preview_artifact:
        description: 'Same-run artifact containing a prepared candidate bundle; empty checks the normal checkout'
        type: string
        default: ''
      preview_sha:
        description: 'Exact candidate commit produced by trusted preparation'
        type: string
        default: ''
      preview_source:
        description: 'Frozen upstream parent of the customization candidate'
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      unit: ${{ steps.select.outputs.unit }}
      worker: ${{ steps.select.outputs.worker }}
      kernel: ${{ steps.select.outputs.kernel }}
      web: ${{ steps.select.outputs.web }}
      contracts: ${{ steps.select.outputs.contracts }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks from actual delivery trees
        id: select
        env:
          PREVIEW_ARTIFACT: ${{ inputs.preview_artifact }}
        run: python3 scripts/upstream-sync/ci_plan.py

  unit:
    needs: plan
    if: needs.plan.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download prepared upstream candidate
        if: inputs.preview_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.preview_artifact }}
          path: ${{ runner.temp }}/upstream-candidate
      - name: Check out the exact prepared candidate
        if: inputs.preview_artifact != ''
        env:
          PREVIEW_SHA: ${{ inputs.preview_sha }}
          PREVIEW_SOURCE: ${{ inputs.preview_source }}
        run: python3 scripts/upstream-sync/preview.py restore --bundle "$RUNNER_TEMP/upstream-candidate/candidate.bundle" --sha "$PREVIEW_SHA" --source "$PREVIEW_SOURCE"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: worker/go.sum
      - run: npm ci
      - name: panel user and onboarding regression tests
        run: node --test test/unit/panel-users.test.mjs test/unit/onboarding.test.mjs test/e2e/panel-users.e2e.test.mjs
      - name: Upstream preview safety and Git integration tests
        run: python3 -m unittest discover -s test/upstream_sync -v
      - name: Release planning and publication contracts
        run: python3 -m unittest discover -s test/release -v
      - name: format-check
        run: npx biome format
      - name: syntax-check Node source and scripts
        run: |
          find src scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: slot payloads and egress helper used by the unit tests
        run: |
          npm run fetch:payload
          npm run build:egress
      - run: npm run test:unit
      - name: ARM64 host preparation and rollback tests
        run: python3 -m unittest discover -s test/deploy -v

  worker:
    needs: plan
    if: needs.plan.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download prepared upstream candidate
        if: inputs.preview_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.preview_artifact }}
          path: ${{ runner.temp }}/upstream-candidate
      - name: Check out the exact prepared candidate
        if: inputs.preview_artifact != ''
        env:
          PREVIEW_SHA: ${{ inputs.preview_sha }}
          PREVIEW_SOURCE: ${{ inputs.preview_source }}
        run: python3 scripts/upstream-sync/preview.py restore --bundle "$RUNNER_TEMP/upstream-candidate/candidate.bundle" --sha "$PREVIEW_SHA" --source "$PREVIEW_SOURCE"
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            worker/go.sum
            api-kernel/go.sum
      - name: gofmt
        run: |
          files=$(gofmt -l worker api-kernel)
          if [ -n "$files" ]; then
            printf 'gofmt needed:\n%s\n' "$files" >&2
            exit 1
          fi
      - name: go test race
        run: |
          (cd worker && go test -race ./...)
          (cd api-kernel && go test -race ./...)
      - name: go vet
        run: |
          (cd worker && go vet ./...)
          (cd api-kernel && go vet ./...)
      - name: build Go commands
        run: |
          (cd worker && CGO_ENABLED=0 go build -trimpath ./cmd/...)
          (cd api-kernel && CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/kin-api-kernel" ./cmd/kin-api-kernel)

  kernel:
    needs: plan
    if: needs.plan.outputs.kernel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download prepared upstream candidate
        if: inputs.preview_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.preview_artifact }}
          path: ${{ runner.temp }}/upstream-candidate
      - name: Check out the exact prepared candidate
        if: inputs.preview_artifact != ''
        env:
          PREVIEW_SHA: ${{ inputs.preview_sha }}
          PREVIEW_SOURCE: ${{ inputs.preview_source }}
        run: python3 scripts/upstream-sync/preview.py restore --bundle "$RUNNER_TEMP/upstream-candidate/candidate.bundle" --sha "$PREVIEW_SHA" --source "$PREVIEW_SOURCE"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: pinned linux amd64 payload ELFs
        run: |
          node scripts/fetch-payload.mjs
          node scripts/fetch-payload.mjs --check
          for b in bin/kin-kernel bin/kin-codex-kernel bin/kin-oauth-auth share/wrap-cli/kin-kernel.bin share/wrap-cli/cli-node share/wrap-cli/cc-node share/crag/kin-kernel; do
            file "$b" | grep -q 'ELF 64-bit LSB .*x86-64'
          done

  web:
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download prepared upstream candidate
        if: inputs.preview_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.preview_artifact }}
          path: ${{ runner.temp }}/upstream-candidate
      - name: Check out the exact prepared candidate
        if: inputs.preview_artifact != ''
        env:
          PREVIEW_SHA: ${{ inputs.preview_sha }}
          PREVIEW_SOURCE: ${{ inputs.preview_source }}
        run: python3 scripts/upstream-sync/preview.py restore --bundle "$RUNNER_TEMP/upstream-candidate/candidate.bundle" --sha "$PREVIEW_SHA" --source "$PREVIEW_SOURCE"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - name: install and verify
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm format:check
          pnpm test
          pnpm build

  contracts:
    needs: plan
    if: needs.plan.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RELAY_ACCEPTANCE_URL: ''
      RELAY_ACCEPTANCE_KEY: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download prepared upstream candidate
        if: inputs.preview_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.preview_artifact }}
          path: ${{ runner.temp }}/upstream-candidate
      - name: Check out the exact prepared candidate
        if: inputs.preview_artifact != ''
        env:
          PREVIEW_SHA: ${{ inputs.preview_sha }}
          PREVIEW_SOURCE: ${{ inputs.preview_source }}
        run: python3 scripts/upstream-sync/preview.py restore --bundle "$RUNNER_TEMP/upstream-candidate/candidate.bundle" --sha "$PREVIEW_SHA" --source "$PREVIEW_SOURCE"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: api-kernel/go.sum
      - run: npm ci
      - name: Build isolated API kernel for contract tests
        working-directory: api-kernel
        run: |
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/kin-api-kernel-contracts" ./cmd/kin-api-kernel
          echo "KIN_API_KERNEL_BIN=$RUNNER_TEMP/kin-api-kernel-contracts" >> "$GITHUB_ENV"
      - name: Commercial authorization, settlement and native model catalog contracts
        run: |
          node --import ./test/fixtures/kin-computer-test-env.mjs --test \
            test/e2e/relay-operations.e2e.test.mjs \
            test/e2e/relay-refinements.e2e.test.mjs \
            test/e2e/codex-key-catalog.e2e.test.mjs

  result:
    if: always()
    needs: [plan, unit, worker, kernel, web, contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected check to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          assert needs['plan']['result'] == 'success', 'CI selection failed'
          for job in ('unit', 'worker', 'kernel', 'web', 'contracts'):
              selected = needs['plan']['outputs'].get(job)
              assert selected in ('true', 'false'), f'{job}: missing selection'
              expected = 'success' if selected == 'true' else 'skipped'
              assert needs[job]['result'] == expected, f'{job}: {needs[job]["result"]}'
          PYTHON
