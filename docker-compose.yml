# 控制面容器 + 宿主机 Docker 管槽位。
# 镜像直接拉取，不在用户机器上构建；仓库目录不再限定 /opt/tapmodels：
# 槽容器的 -v 源路径由控制面自省 `docker inspect tapmodels` 的 Mounts 换算成宿主路径。
# 本地开发要构建镜像：docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  tapmodels:
    image: ${TAPMODELS_IMAGE:-ghcr.io/holeenlu/tapmodels-gateway}:${TAPMODELS_IMAGE_TAG:-latest}
    container_name: ${TAPMODELS_CONTAINER_NAME:-tapmodels}
    restart: unless-stopped
    init: true
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file:
      - .env
    environment:
      KIN_PROJECT_ROOT: /opt/tapmodels
      KIN_DATA_DIR: /opt/tapmodels/data
      KIN_KERNEL_BIN: /opt/tapmodels/bin/kin-kernel
      KIN_EGRESS_BIN: /opt/tapmodels/bin/kin-egress
      KIN_WORKER_BIN: /opt/tapmodels/bin/kin-worker
      KIN_CODEX_KERNEL_BIN: /opt/tapmodels/bin/kin-codex-kernel
      KIN_OAUTH_AUTH_BIN: /opt/tapmodels/bin/kin-oauth-auth
      KIN_COMPUTER_BIN: ${KIN_COMPUTER_BIN:-/opt/tapmodels/bin/kin-computer}
      KIN_AUTO_SYNC_WRAP: ${KIN_AUTO_SYNC_WRAP:-1}
      # 自省容器名；TAPMODELS_HOST_ROOT 可显式覆盖宿主安装目录。
      TAPMODELS_CONTAINER_NAME: ${TAPMODELS_CONTAINER_NAME:-tapmodels}
      TAPMODELS_HOST_ROOT: ${TAPMODELS_HOST_ROOT:-}
      HOST: 0.0.0.0
      PORT: ${PORT:-8787}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./vms:/opt/tapmodels/vms
      - ./data:/opt/tapmodels/data
      - ./bin:/opt/tapmodels/bin
      - ./share:/opt/tapmodels/share
      - ./src/config:/opt/tapmodels/src/config
